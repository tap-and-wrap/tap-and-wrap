    <style>.site-boot{display:none}.tw-booting #root,.tw-booting .seo-boot-fallback{display:none}.tw-booting .site-boot{display:grid;place-content:center;justify-items:center;gap:24px;min-height:85vh;background:#FFFCFB;color:#62483F;font:16px/1.5 Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box}.site-boot img{width:210px;max-width:80vw;height:auto}.site-boot-line{height:3px;width:160px;border-radius:3px;background:#EADAD5}.site-boot-line:after{content:'';display:block;width:45%;height:100%;background:#915B50;animation:boot-wait 1.2s ease-in-out infinite alternate}@keyframes boot-wait{to{transform:translateX(120%)}}@media(prefers-reduced-motion:reduce){.site-boot-line:after{animation:none}}</style>

    <script type="module" src="/src/main.jsx"></script>
